<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AirPods Case Holder — SEASON 2</title><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:#fff; color:#111; }
header { padding:28px 24px 18px; text-align:center; }
header h1 { font-size:20px; font-weight:600; letter-spacing:4px; }
header p { font-size:11px; color:#888; letter-spacing:2px; margin-top:6px; text-transform:uppercase; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:0 2px; }
@media (max-width:800px){ .grid { grid-template-columns:repeat(2,1fr); } }
.card { display:block; text-decoration:none; color:inherit; position:relative; }
.card .ph { position:relative; aspect-ratio:4/5; overflow:hidden; background:#f5f5f4; }
.card .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .35s; }
.card .ph img.hov { opacity:0; }
.card:hover .ph img.hov { opacity:1; }
.meta { text-align:center; padding:12px 6px 26px; }
.meta .brand { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#666; }
.meta .name { font-size:13px; margin-top:3px; }
.phead { text-align:center; padding:22px 20px 10px; }
.phead a { color:#888; font-size:12px; text-decoration:none; letter-spacing:1px; }
.phead h1 { font-size:18px; font-weight:600; letter-spacing:2px; margin-top:8px; }
.phead .brand { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#666; margin-top:4px; }
.carousel { max-width:680px; margin:14px auto 40px; padding:0 16px; }
.stage { position:relative; background:#f5f5f4; aspect-ratio:4/5; }
.stage img, .stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.stage img.on, .stage video.on { display:block; }
.stage button { position:absolute; top:50%; transform:translateY(-50%); border:none; background:rgba(255,255,255,.75);
  width:38px; height:38px; cursor:pointer; font-size:16px; }
.stage button.prev { left:10px; } .stage button.next { right:10px; }
.thumbs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.thumbs .th { width:64px; height:80px; object-fit:cover; cursor:pointer; opacity:.55; border:1px solid #ddd; }
.thumbs .th.on { opacity:1; border-color:#111; }
.count { text-align:center; font-size:11px; color:#888; margin-top:8px; letter-spacing:1px; }
.foot { text-align:center; font-size:10px; color:#bbb; padding:18px 0 30px; letter-spacing:1px; }
</style></head><body>
<div class="phead"><a href="index.html">← Back to New Arrivals</a>
<h1>AirPods Case Holder</h1><div class="brand">Chanel</div></div>
<div class="carousel">
<div class="stage" id="stage"><img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-front-open-white.jpg" class="media on" data-i="0">
<img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-back-white.jpg" class="media" data-i="1">
<img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-top-white.jpg" class="media" data-i="2">
<img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-macro-white.jpg" class="media" data-i="3">
<img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-worn1.jpg" class="media" data-i="4">
<img src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-hand1.jpg" class="media" data-i="5">

<button class="prev" onclick="step(-1)">‹</button><button class="next" onclick="step(1)">›</button>
</div>
<div class="count" id="count"></div>
<div class="thumbs"><img class="th on" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-front-open-white.jpg" data-i="0" onclick="go(0)">
<img class="th" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-back-white.jpg" data-i="1" onclick="go(1)">
<img class="th" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-top-white.jpg" data-i="2" onclick="go(2)">
<img class="th" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-macro-white.jpg" data-i="3" onclick="go(3)">
<img class="th" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-worn1.jpg" data-i="4" onclick="go(4)">
<img class="th" src="assets/chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-hand1.jpg" data-i="5" onclick="go(5)">
</div>
</div>
<script>
const media = [{"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-front-open-white"}, {"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-back-white"}, {"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-top-white"}, {"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-macro-white"}, {"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-worn1"}, {"type": "img", "src": "chanel-airpods-holder-ACC-CHANEL-AIRPOD-001-beauty-hand1"}];
let idx = 0;
function show() {
  document.querySelectorAll('.media').forEach((el, i) => {
    el.classList.toggle('on', i === idx);
    if (el.tagName === 'VIDEO') { el.muted = true; if (i === idx) { el.play().catch(()=>{}); } else el.pause(); }
  });
  document.querySelectorAll('.th').forEach((el, i) => el.classList.toggle('on', i === idx));
  document.getElementById('count').textContent = (idx+1) + ' / ' + media.length;
}
function step(d) { idx = (idx + d + media.length) % media.length; show(); }
function go(i) { idx = i; show(); }
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
show();
</script>
<div class="foot">SEASON 2 — photos shown are produced with AI-assisted pipelines</div>
</body></html>
